name: CI

on:
  push:
    branches: [ feature ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker (dev)
        run: docker compose -f docker-compose.dev.yml build --no-cache

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest || echo "No test yet , wait for it "

      - name: Test Flask health with Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml up -d
          sleep 10
          docker compose -f docker-compose.dev.yml ps
          curl -f http://localhost:5000 || echo "Health check failed"
          docker compose -f docker-compose.dev.yml down

  publish:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build Docker image for GHCR
        run: |
          docker build -t ghcr.io/${OWNER_LC}/focus-dimage:dev .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: docker push ghcr.io/${OWNER_LC}/focus-dimage:dev

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/feature' && github.event_name == 'push'

    steps:
      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Decode SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ec2-13-126-186-131.ap-south-1.compute.amazonaws.com
          username: ubuntu
          key_path: /tmp/ec2_key.pem
          script: |
            set -e
            echo "Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "Pulling latest image..."
            docker pull ghcr.io/${{ env.OWNER_LC }}/focus-dimage:dev
            
            echo "Stopping existing container..."
            docker stop focus-api || true
            docker rm focus-api || true
            
            echo "Starting new container..."
            docker run -d \
              --name focus-api \
              -p 5000:5000 \
              -v /home/ubuntu/focus-track/instance:/app/instance \
              ghcr.io/${{ env.OWNER_LC }}/focus-dimage:dev
            
            echo "Waiting for container to be healthy..."
            sleep 5
            
            echo "Deployment complete!"
            docker ps | grep focus-api

