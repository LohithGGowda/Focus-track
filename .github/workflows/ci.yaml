name: CI

on:
  push:
    branches: [ feature ]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run linter
        run: ruff check .

  build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker (dev)
        run: docker compose -f docker-compose.dev.yml build --no-cache

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest || echo "No test yet , wait for it "

      - name: Test Flask health with Docker Compose
        run: |
          docker compose -f docker-compose.dev.yml up -d
          sleep 10
          docker compose -f docker-compose.dev.yml ps
          curl -f http://localhost:5000 || echo "Health check failed"
          docker compose -f docker-compose.dev.yml down

  publish:
    runs-on: ubuntu-latest
    # needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build Docker image for GHCR
        run: |
          docker build -t ghcr.io/${OWNER_LC}/focus-dimage:dev .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image to GHCR
        run: docker push ghcr.io/${OWNER_LC}/focus-dimage:dev

  deploy:
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Pull image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/${{ github.repository_owner }}/focus-dimage:dev

      - name: Run container (smoke test)
        run: |
          docker run -d --name focus-api -p 5000:5000 ghcr.io/${{ github.repository_owner }}/focus-dimage:dev
          sleep 10
          curl -f http://localhost:5000 || (echo "Smoke test failed" && exit 1)
          docker logs focus-api

      - name: Stop and remove container
        if: always()
        run: |
          docker stop focus-api || true
          docker rm focus-api || true
 

