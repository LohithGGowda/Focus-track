name: CI

on:
  push:
    branches: [ feature ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from FOCUS-TRACK
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker (dev)
        run: docker compose -f docker-compose.dev.yml build --no-cache


  test:
    runs on: ubuntu-latest
    needs: built

    steps: 
      - name: Run tests
        run: |
          pytest || echo "No test yet , wait for it "

      - name: Test Flask health
        run: |
          docker compose -f docker-compose.dev.yml up -d
          sleep 10  # Wait startup
          docker compose -f docker-compose.dev.yml ps  # Verify running
          curl -f http://localhost:5000 || echo "Health check failed"
          docker compose -f docker-compose.dev.yml down

  deploy:
    runs on: ubuntu-latest
    needs: test

    steps:
      - name: its up to the deployment 
        run: echo "deployment steps will be added here"
             